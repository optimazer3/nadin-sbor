[project]
name = "nadin-sbor-bot"
version = "0.1.0"
description = "Telegram-бот руководителя для учёта задач команды (голос, Supabase, AssemblyAI, Polza AI)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E", "W", "B", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["bot"]
known-third-party = ["supabase"]
